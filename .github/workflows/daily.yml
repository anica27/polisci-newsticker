name: Tägliche Publikationen senden

on:
  schedule:
    - cron: '0 7 * * *'
  workflow_dispatch:

jobs:
  post-to-telegram:
    runs-on: ubuntu-latest
    steps:
      - name: Code auschecken
        uses: actions/checkout@v4

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Abhängigkeiten installieren
        run: |
          pip install requests

      - name: Skript ausführen
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID_IB: ${{ secrets.CHAT_ID_IB }}
          CHAT_ID_VERGLEICH: ${{ secrets.CHAT_ID_VERGLEICH }}
          CHAT_ID_THEORIE: ${{ secrets.CHAT_ID_THEORIE }}
          CHAT_ID_POLICY: ${{ secrets.CHAT_ID_POLICY }}
        run: |
          python daily_poster.py

      - name: Gesehene IDs ins Repository committen
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add seen_ids.txt
          git commit -m "Auto: Update seen_ids.txt" || echo "Keine Änderungen"
          git push
